<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grúas del Norte — Admin</title>
<style>
/* ─── Tokens ──────────────────────────────────────────────────────────────── */
:root {
  --bg:       #0D0D0D;
  --surface:  #181818;
  --raised:   #222222;
  --border:   #2E2E2E;
  --text:     #EDEBE5;
  --muted:    #7A7673;
  --accent:   #F5A623;
  --accent-d: #C27F0F;
  --success:  #34D399;
  --danger:   #F87171;
  --warn:     #FBBF24;
  color-scheme: dark;
}
/* ─── Reset ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
a { color: var(--accent); text-decoration: none; }
button { cursor: pointer; font: inherit; border: none; }
input, select { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* ─── Layout ──────────────────────────────────────────────────────────────── */
#app { display: flex; height: 100%; }

aside {
  width: 220px; flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 24px 0;
}
aside .brand {
  padding: 0 20px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
aside .brand-name { font-size: 15px; font-weight: 700; color: var(--text); }
aside .brand-sub  { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
aside .brand-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: #fff; color: #000;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; margin-bottom: 10px;
}
nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
nav button {
  width: 100%; text-align: left;
  padding: 9px 12px; border-radius: 7px;
  color: var(--muted); background: transparent;
  display: flex; align-items: center; gap: 10px;
  font-size: 13.5px; transition: background .12s, color .12s;
}
nav button:hover    { background: var(--raised); color: var(--text); }
nav button.active   { background: #fff; color: #000; font-weight: 600; }
nav button .icon    { width: 16px; text-align: center; flex-shrink: 0; }

aside .user-row {
  margin: 12px 10px 0;
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
}
.user-row .user-name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-row button { padding: 4px 8px; font-size: 11px; border-radius: 5px; background: var(--raised); color: var(--muted); }

main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }

header {
  padding: 20px 28px 0;
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-shrink: 0;
}
header h1 { font-size: 20px; font-weight: 700; }
header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.content { padding: 20px 28px 40px; flex: 1; }

/* ─── Login ───────────────────────────────────────────────────────────────── */
#login-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 36px 32px;
  width: 340px;
  display: flex; flex-direction: column; gap: 16px;
}
.login-card .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.login-card .logo-icon {
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--accent); color: #000;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.login-card h2 { font-size: 18px; font-weight: 700; }
.login-card .caption { font-size: 12px; color: var(--muted); }
.login-card label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
.login-card input { width: 100%; }
.btn-primary {
  background: var(--accent); color: #000; font-weight: 700;
  padding: 10px 16px; border-radius: 8px; font-size: 14px;
  transition: background .12s;
}
.btn-primary:hover { background: var(--accent-d); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
#login-error { color: var(--danger); font-size: 12px; display: none; }

/* ─── Cards de stat ───────────────────────────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px;
}
.stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat-card .value.accent { color: var(--accent); }
.stat-card .value.success { color: var(--success); }

/* ─── Tabla ───────────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
thead th {
  padding: 10px 14px; text-align: left;
  font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 11px 14px; background: var(--bg); }
tbody tr:hover td { background: var(--surface); }

/* ─── Badges ──────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600; letter-spacing: .03em;
}
.badge-green  { background: #052718; color: var(--success); }
.badge-yellow { background: #2B1D00; color: var(--warn); }
.badge-red    { background: #2C0A0A; color: var(--danger); }
.badge-gray   { background: var(--raised); color: var(--muted); }
.badge-blue   { background: #0A1A2E; color: #60A5FA; }

/* ─── Botones inline ──────────────────────────────────────────────────────── */
.btn-sm {
  padding: 5px 11px; border-radius: 6px;
  font-size: 12px; font-weight: 600;
}
.btn-approve { background: #052718; color: var(--success); border: 1px solid #1a5c3a; }
.btn-approve:hover { background: #0d3d24; }
.btn-approve:disabled { opacity: .4; cursor: default; }
.btn-danger  { background: #2a0a0a; color: #f87171; border: 1px solid #5c1a1a; }
.btn-danger:hover { background: #3d1212; }
.btn-danger:disabled { opacity: .4; cursor: default; }

/* ─── Sección de tarifas ──────────────────────────────────────────────────── */
.tariff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.tariff-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
}
.tariff-card h3 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.tariff-card label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
.tariff-card input { width: 100%; }

/* ─── Toast ───────────────────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 18px;
  font-size: 13px; font-weight: 500;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
  white-space: nowrap; z-index: 200;
}
#toast.show { opacity: 1; }
#toast.ok   { border-color: var(--success); color: var(--success); }
#toast.err  { border-color: var(--danger);  color: var(--danger); }

/* ─── Paginación ──────────────────────────────────────────────────────────── */
.pagination { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; }
.pagination button {
  padding: 5px 12px; border-radius: 6px;
  background: var(--raised); color: var(--text); font-size: 12px;
}
.pagination button:disabled { opacity: .3; cursor: default; }
.pagination .page-info { color: var(--muted); }

/* ─── Filtros ─────────────────────────────────────────────────────────────── */
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.toolbar select { font-size: 12px; padding: 6px 10px; }

/* ─── Loading ─────────────────────────────────────────────────────────────── */
.loading { color: var(--muted); padding: 32px 0; text-align: center; }
.empty   { color: var(--muted); padding: 48px 0; text-align: center; font-size: 13px; }

/* ─── Flota / Mapa ────────────────────────────────────────────────────────── */
#fleet-map { width: 100%; height: 480px; border-radius: 10px; border: 1px solid var(--border); }
.fleet-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; font-size: 12px; }
.fleet-legend span { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot-online  { background: #34D399; }
.dot-offline { background: #6B7280; }
.dot-service { background: #F5A623; }
.driver-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 16px; }
.driver-pin-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px;
  display: flex; align-items: center; gap: 10px; cursor: pointer;
}
.driver-pin-card:hover { border-color: var(--accent); }
.driver-pin-card .pin-info { min-width: 0; }
.driver-pin-card .pin-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.driver-pin-card .pin-status { font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">🚛</div>
      <div>
        <div style="font-size:16px;font-weight:700">Grúas del Norte</div>
        <div style="font-size:11px;color:var(--muted)">Panel de Administración</div>
      </div>
    </div>
    <label>
      Correo electrónico
      <input type="email" id="login-email" placeholder="admin@gruasdelnorte.com" autocomplete="username">
    </label>
    <label>
      Contraseña
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </label>
    <div id="login-error"></div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- App shell -->
<div id="app" style="display:none">
  <aside>
    <div class="brand">
      <div class="brand-icon">🚛</div>
      <div class="brand-name">Grúas del Norte</div>
      <div class="brand-sub">Admin</div>
    </div>
    <nav>
      <button class="active" onclick="goTo('dashboard')" id="nav-dashboard">
        <span class="icon">📊</span> Dashboard
      </button>
      <button onclick="goTo('drivers')" id="nav-drivers">
        <span class="icon">🚘</span> Conductores
      </button>
      <button onclick="goTo('orders')" id="nav-orders">
        <span class="icon">📋</span> Órdenes
      </button>
      <button onclick="goTo('tariffs')" id="nav-tariffs">
        <span class="icon">💰</span> Tarifas
      </button>
      <button onclick="goTo('fleet')" id="nav-fleet">
        <span class="icon">🗺️</span> Flota en vivo
      </button>
    </nav>
    <div class="user-row">
      <span class="user-name" id="user-name-label">—</span>
      <button onclick="logout()">Salir</button>
    </div>
  </aside>

  <main id="main-panel">
    <!-- content injected here -->
  </main>
</div>

<div id="toast"></div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
let TOKEN = '';
let currentPage = 'dashboard';
let orderPage   = 1;
let orderStatus = '';

function getToken() {
  try { return localStorage.getItem('gdn_token') || ''; } catch { return TOKEN; }
}
function setToken(t) {
  TOKEN = t;
  try { localStorage.setItem('gdn_token', t); } catch {}
}
function clearToken() {
  TOKEN = '';
  try { localStorage.removeItem('gdn_token'); } catch {}
}

// ─── API ────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}` },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  if (res.status === 401) { logout(); throw new Error('No autorizado'); }
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  if (!res.ok) throw new Error(data?.error || data || `Error ${res.status}`);
  return data;
}

// ─── Toast ───────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

// ─── Auth ────────────────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const err   = document.getElementById('login-error');
  const btn   = document.getElementById('login-btn');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  try {
    const data = await api('POST', '/auth/login', { email, password: pass });
    if (data.user.role !== 'ADMIN') throw new Error('Esta cuenta no es ADMIN');
    setToken(data.token);
    document.getElementById('user-name-label').textContent = data.user.name;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    goTo('dashboard');
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
document.getElementById('login-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function logout() {
  clearToken();
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

// ─── Nav ─────────────────────────────────────────────────────────────────────
function goTo(page) {
  if (fleetTimer) { clearInterval(fleetTimer); fleetTimer = null; }
  currentPage = page;
  ['dashboard','drivers','orders','tariffs','fleet'].forEach(p => {
    document.getElementById('nav-' + p).classList.toggle('active', p === page);
  });
  render(page);
}

function render(page) {
  const main = document.getElementById('main-panel');
  main.innerHTML = '<div class="loading">Cargando…</div>';
  if (page === 'dashboard') renderDashboard();
  else if (page === 'drivers')  renderDrivers();
  else if (page === 'orders')   renderOrders();
  else if (page === 'tariffs')  renderTariffs();
  else if (page === 'fleet')    renderFleet();
}

// ─── Dashboard ───────────────────────────────────────────────────────────────
async function renderDashboard() {
  const main = document.getElementById('main-panel');
  try {
    const s = await api('GET', '/admin/stats');
    main.innerHTML = `
      <header>
        <div>
          <h1>Dashboard</h1>
          <div class="sub">Resumen general de la plataforma</div>
        </div>
        <button class="btn-sm" style="background:var(--raised);color:var(--text)"
          onclick="renderDashboard()">↻ Actualizar</button>
      </header>
      <div class="content">
        <div class="stat-grid">
          <div class="stat-card">
            <div class="label">Órdenes hoy</div>
            <div class="value accent">${s.ordenesHoy}</div>
          </div>
          <div class="stat-card">
            <div class="label">Ingresos totales</div>
            <div class="value success">$${Number(s.ingresosTotales).toLocaleString('es-MX', {maximumFractionDigits:0})}</div>
          </div>
          <div class="stat-card">
            <div class="label">Conductores activos</div>
            <div class="value">${s.driversActivos}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px">
          <div class="stat-card" style="cursor:pointer" onclick="goTo('drivers')">
            <div class="label">Conductores</div>
            <div style="font-size:13px;color:var(--muted);margin-top:6px">Ver lista →</div>
          </div>
          <div class="stat-card" style="cursor:pointer" onclick="goTo('orders')">
            <div class="label">Órdenes</div>
            <div style="font-size:13px;color:var(--muted);margin-top:6px">Ver lista →</div>
          </div>
        </div>
      </div>`;
  } catch (e) {
    main.innerHTML = `<div class="content"><div class="empty">Error: ${e.message}</div></div>`;
  }
}

// ─── Drivers ─────────────────────────────────────────────────────────────────
async function renderDrivers() {
  const main = document.getElementById('main-panel');
  try {
    const drivers = await api('GET', '/admin/drivers');
    const pending = drivers.filter(d => d.vehicle && !d.vehicle.verified).length;
    main.innerHTML = `
      <header>
        <div>
          <h1>Conductores</h1>
          <div class="sub">${drivers.length} registrados · ${pending} pendientes de verificación</div>
        </div>
        <button class="btn-sm" style="background:var(--raised);color:var(--text)"
          onclick="renderDrivers()">↻ Actualizar</button>
      </header>
      <div class="content">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Conductor</th>
                <th>Contacto</th>
                <th>Vehículo</th>
                <th>Estado</th>
                <th>En línea</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${drivers.length === 0 ? '<tr><td colspan="6"><div class="empty">Sin conductores</div></td></tr>' :
                drivers.map(d => {
                  const v = d.vehicle;
                  const online = d.driverStatus?.available;
                  const verified = v?.verified;
                  return `<tr>
                    <td>
                      <div style="font-weight:600">${esc(d.name)}</div>
                      <div style="font-size:11px;color:var(--muted)">${esc(d.id.slice(-6))}</div>
                    </td>
                    <td>
                      <div>${esc(d.email || '—')}</div>
                      <div style="color:var(--muted)">${esc(d.phone || '—')}</div>
                    </td>
                    <td>${v
                      ? `<div>${esc(v.brand)} ${esc(v.model)} ${v.year}</div>
                         <div style="font-size:11px;color:var(--muted)">${esc(v.plates)} · ${esc(v.type)}</div>`
                      : '<span style="color:var(--muted)">Sin vehículo</span>'}</td>
                    <td>
                      ${!v
                        ? '<span class="badge badge-gray">Sin vehículo</span>'
                        : verified
                          ? '<span class="badge badge-green">Verificado</span>'
                          : '<span class="badge badge-yellow">Pendiente</span>'}
                      ${!d.active ? '<span class="badge badge-red" style="margin-left:4px">Inactivo</span>' : ''}
                    </td>
                    <td>
                      <span class="badge ${online ? 'badge-green' : 'badge-gray'}">
                        ${online ? '● En línea' : '○ Offline'}
                      </span>
                    </td>
                    <td>
                      <div style="display:flex;gap:6px;flex-wrap:wrap;min-width:120px">
                        ${v && !verified
                          ? `<button class="btn-sm btn-approve" onclick="approveDriver('${d.id}', this)">✓ Aprobar</button>`
                          : ''}
                        ${d.active
                          ? `<button class="btn-sm btn-danger" onclick="setDriverStatus('${d.id}', false, this)">⏸ Suspender</button>`
                          : `<button class="btn-sm btn-approve" onclick="setDriverStatus('${d.id}', true, this)">▶ Activar</button>`}
                      </div>
                    </td>
                  </tr>`;
                }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  } catch (e) {
    main.innerHTML = `<div class="content"><div class="empty">Error: ${e.message}</div></div>`;
  }
}

async function approveDriver(id, btn) {
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await api('PUT', `/admin/drivers/${id}/approve`);
    toast('Conductor aprobado ✓');
    renderDrivers();
  } catch (e) {
    toast(e.message, 'err');
    btn.disabled = false;
    btn.textContent = '✓ Aprobar';
  }
}

async function setDriverStatus(id, active, btn) {
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await api('PUT', `/admin/drivers/${id}/status`, { active });
    toast(active ? 'Conductor activado ✓' : 'Conductor suspendido');
    renderDrivers();
  } catch (e) {
    toast(e.message, 'err');
    btn.disabled = false;
    btn.textContent = active ? '▶ Activar' : '⏸ Suspender';
  }
}

// ─── Orders ──────────────────────────────────────────────────────────────────
const STATUS_LABELS = {
  SEARCHING:       ['badge-yellow', 'Buscando'],
  ACCEPTED:        ['badge-blue',   'Aceptada'],
  DRIVER_ARRIVING: ['badge-blue',   'En camino'],
  IN_SERVICE:      ['badge-blue',   'En servicio'],
  COMPLETED:       ['badge-green',  'Completada'],
  CANCELLED:       ['badge-red',    'Cancelada'],
};

async function renderOrders(page, status) {
  if (page   !== undefined) orderPage   = page;
  if (status !== undefined) orderStatus = status;
  const main = document.getElementById('main-panel');
  try {
    const qs  = `?page=${orderPage}&limit=15${orderStatus ? '&status=' + orderStatus : ''}`;
    const res = await api('GET', '/admin/orders' + qs);
    const totalPages = Math.ceil(res.total / 15) || 1;
    main.innerHTML = `
      <header>
        <div>
          <h1>Órdenes</h1>
          <div class="sub">${res.total} en total</div>
        </div>
        <button class="btn-sm" style="background:var(--raised);color:var(--text)"
          onclick="renderOrders()">↻ Actualizar</button>
      </header>
      <div class="content">
        <div class="toolbar">
          <select onchange="renderOrders(1, this.value)">
            <option value=""   ${!orderStatus     ? 'selected':''}>Todos los estados</option>
            <option value="SEARCHING"       ${orderStatus==='SEARCHING'       ?'selected':''}>Buscando</option>
            <option value="ACCEPTED"        ${orderStatus==='ACCEPTED'        ?'selected':''}>Aceptadas</option>
            <option value="DRIVER_ARRIVING" ${orderStatus==='DRIVER_ARRIVING' ?'selected':''}>En camino</option>
            <option value="IN_SERVICE"      ${orderStatus==='IN_SERVICE'      ?'selected':''}>En servicio</option>
            <option value="COMPLETED"       ${orderStatus==='COMPLETED'       ?'selected':''}>Completadas</option>
            <option value="CANCELLED"       ${orderStatus==='CANCELLED'       ?'selected':''}>Canceladas</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Conductor</th>
                <th>Tipo</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody>
              ${res.orders.length === 0 ? '<tr><td colspan="7"><div class="empty">Sin órdenes</div></td></tr>' :
                res.orders.map(o => {
                  const [cls, label] = STATUS_LABELS[o.status] || ['badge-gray', o.status];
                  const fecha = new Date(o.createdAt).toLocaleDateString('es-MX', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
                  return `<tr>
                    <td style="font-family:monospace;font-size:11px;color:var(--muted)">${o.id.slice(-8)}</td>
                    <td>${esc(o.client?.name || '—')}</td>
                    <td>${esc(o.driver?.name || '—')}</td>
                    <td><span class="badge badge-gray">${esc(o.vehicleType)}</span></td>
                    <td style="font-variant-numeric:tabular-nums;font-weight:600">
                      $${Number(o.totalPrice).toLocaleString('es-MX',{maximumFractionDigits:0})}
                    </td>
                    <td><span class="badge ${cls}">${label}</span></td>
                    <td style="color:var(--muted);white-space:nowrap">${fecha}</td>
                  </tr>`;
                }).join('')}
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <button onclick="renderOrders(${orderPage-1})" ${orderPage<=1?'disabled':''}>← Anterior</button>
          <span class="page-info">Página ${orderPage} de ${totalPages}</span>
          <button onclick="renderOrders(${orderPage+1})" ${orderPage>=totalPages?'disabled':''}>Siguiente →</button>
        </div>
      </div>`;
  } catch (e) {
    main.innerHTML = `<div class="content"><div class="empty">Error: ${e.message}</div></div>`;
  }
}

// ─── Tariffs ──────────────────────────────────────────────────────────────────
const VEHICLE_ICONS = { SIMPLE: '🚗', PLATFORM: '🚐', HEAVY: '🚛' };
const VEHICLE_NAMES = { SIMPLE: 'Grúa Simple', PLATFORM: 'Plataforma', HEAVY: 'Grúa Pesada' };

async function renderTariffs() {
  const main = document.getElementById('main-panel');
  try {
    const tariffs = await api('GET', '/admin/tariffs');
    const byType  = {};
    tariffs.forEach(t => { byType[t.vehicleType] = t; });
    const types = ['SIMPLE', 'PLATFORM', 'HEAVY'];

    main.innerHTML = `
      <header>
        <div>
          <h1>Tarifas</h1>
          <div class="sub">Precio base y precio por kilómetro por tipo de vehículo</div>
        </div>
      </header>
      <div class="content">
        <div class="tariff-grid">
          ${types.map(type => {
            const t = byType[type] || { basePrice: 0, pricePerKm: 0 };
            return `<div class="tariff-card">
              <h3>${VEHICLE_ICONS[type]} ${VEHICLE_NAMES[type]}</h3>
              <label>
                Precio base (MXN)
                <input type="number" id="base-${type}" value="${t.basePrice}" min="0" step="10">
              </label>
              <label>
                Precio por km (MXN)
                <input type="number" id="pkm-${type}" value="${t.pricePerKm}" min="0" step="1">
              </label>
              <button class="btn-primary" onclick="saveTariff('${type}', this)">
                Guardar
              </button>
            </div>`;
          }).join('')}
        </div>
        <p style="color:var(--muted);font-size:12px;margin-top:20px">
          Los cambios aplican a nuevas cotizaciones. Órdenes existentes no se afectan.
        </p>
      </div>`;
  } catch (e) {
    main.innerHTML = `<div class="content"><div class="empty">Error: ${e.message}</div></div>`;
  }
}

async function saveTariff(type, btn) {
  const basePrice = parseFloat(document.getElementById('base-' + type).value);
  const pricePerKm = parseFloat(document.getElementById('pkm-' + type).value);
  if (isNaN(basePrice) || isNaN(pricePerKm)) { toast('Valores inválidos', 'err'); return; }
  btn.disabled = true; btn.textContent = '…';
  try {
    await api('PUT', '/admin/tariffs', { vehicleType: type, basePrice, pricePerKm });
    toast(`Tarifa ${VEHICLE_NAMES[type]} guardada ✓`);
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar';
  }
}

// ─── Fleet / Mapa en vivo ────────────────────────────────────────────────────
let fleetMap     = null;
let fleetMarkers = {};
let fleetTimer   = null;

async function renderFleet() {
  const main = document.getElementById('main-panel');
  main.innerHTML = `
    <header>
      <div>
        <h1>Flota en vivo</h1>
        <div class="sub" id="fleet-sub">Actualizando…</div>
      </div>
      <button class="btn-sm" style="background:var(--raised);color:var(--text)" onclick="refreshFleet()">↻ Actualizar</button>
    </header>
    <div class="content">
      <div class="fleet-legend">
        <span><span class="dot dot-online"></span>Disponible</span>
        <span><span class="dot dot-service"></span>En servicio</span>
        <span><span class="dot dot-offline"></span>Desconectado</span>
      </div>
      <div id="fleet-map"></div>
      <div class="driver-list-grid" id="fleet-cards"></div>
    </div>`;

  // Inicializar mapa Leaflet centrado en Tijuana
  if (fleetMap) { fleetMap.remove(); fleetMap = null; }
  fleetMarkers = {};
  fleetMap = L.map('fleet-map').setView([25.4232, -101.0053], 12);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© Esri',
    maxZoom: 19,
  }).addTo(fleetMap);

  await refreshFleet();
  fleetTimer = setInterval(refreshFleet, 1000);
}

function makeIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:32px;height:32px;border-radius:50% 50% 50% 0;
      background:${color};border:3px solid #fff;
      transform:rotate(-45deg);
      box-shadow:0 2px 8px rgba(0,0,0,.4);
      display:flex;align-items:center;justify-content:center;
    "><span style="transform:rotate(45deg);font-size:13px">🚛</span></div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -34],
  });
}

async function refreshFleet() {
  try {
    const drivers = await api('GET', '/admin/drivers');
    const active  = drivers.filter(d => d.driverStatus?.currentLat);
    const sub     = document.getElementById('fleet-sub');
    if (sub) sub.textContent = `${active.length} con GPS activo · ${drivers.length} total · actualiza cada 1s`;

    // Actualizar marcadores
    const seen = new Set();
    active.forEach(d => {
      const lat = d.driverStatus.currentLat;
      const lng = d.driverStatus.currentLng;
      const available = d.driverStatus.available;
      const color = available ? '#34D399' : '#F5A623';
      const popup = `<b>${d.name}</b><br>${d.vehicle ? d.vehicle.brand + ' ' + d.vehicle.model : 'Sin vehículo'}<br>${available ? '✅ Disponible' : '🔧 En servicio'}`;

      if (fleetMarkers[d.id]) {
        fleetMarkers[d.id].setLatLng([lat, lng]);
        fleetMarkers[d.id].setIcon(makeIcon(color));
        fleetMarkers[d.id].getPopup().setContent(popup);
      } else {
        fleetMarkers[d.id] = L.marker([lat, lng], { icon: makeIcon(color) })
          .addTo(fleetMap)
          .bindPopup(popup);
      }
      seen.add(d.id);
    });

    // Remover marcadores de conductores que ya no tienen GPS
    Object.keys(fleetMarkers).forEach(id => {
      if (!seen.has(id)) { fleetMap.removeLayer(fleetMarkers[id]); delete fleetMarkers[id]; }
    });

    // Cards debajo del mapa
    const cardsEl = document.getElementById('fleet-cards');
    if (cardsEl) {
      cardsEl.innerHTML = drivers.map(d => {
        const online   = d.driverStatus?.available;
        const hasGps   = !!d.driverStatus?.currentLat;
        const dotClass = hasGps ? (online ? 'dot-online' : 'dot-service') : 'dot-offline';
        const statusTxt = hasGps ? (online ? 'Disponible' : 'En servicio') : 'Sin GPS';
        return `<div class="driver-pin-card" onclick="${hasGps ? `fleetMap && fleetMap.setView([${d.driverStatus.currentLat},${d.driverStatus.currentLng}],15); fleetMarkers['${d.id}'] && fleetMarkers['${d.id}'].openPopup()` : ''}">
          <span class="dot ${dotClass}" style="flex-shrink:0"></span>
          <div class="pin-info">
            <div class="pin-name">${esc(d.name)}</div>
            <div class="pin-status">${statusTxt} · ${d.vehicle ? esc(d.vehicle.brand)+' '+esc(d.vehicle.model) : 'Sin vehículo'}</div>
          </div>
        </div>`;
      }).join('');
    }
  } catch (e) {
    const sub = document.getElementById('fleet-sub');
    if (sub) sub.textContent = 'Error: ' + e.message;
  }
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
(function boot() {
  const t = getToken();
  if (!t) return;
  // Verificar token guardado
  fetch('/api/auth/me', { headers: { Authorization: `Bearer ${t}` } })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(u => {
      if (u.role !== 'ADMIN') throw new Error();
      document.getElementById('user-name-label').textContent = u.name;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      goTo('dashboard');
    })
    .catch(() => clearToken());
})();
</script>
